name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall hakyking dev_tools
      - name: Test audio edit model
        run: python -m unittest discover -s tests -p "test_audio_edit_model.py" -v
      - name: Test project reliability
        run: python -m unittest discover -s tests -p "test_project_reliability.py" -v
      - name: Test audio analysis and cache
        run: python -m unittest discover -s tests -p "test_adaptive_pitch_engine.py" -v
      - name: Test audio cache
        run: python -m unittest discover -s tests -p "test_analysis_cache_and_fast_path.py" -v
      - name: Test DSP and render parity
        run: python -m unittest discover -s tests -p "test_dynamic_pitch_map.py" -v
      - name: Test mixdown parity
        run: python -m unittest discover -s tests -p "test_mixdown_parity.py" -v
      - name: Test render cache
        run: python -m unittest discover -s tests -p "test_render_result_cache.py" -v
      - name: Test pitch tools
        run: python -m unittest discover -s tests -p "test_pitch_tool_contracts.py" -v
      - name: Test progressive UI pipeline
        run: python -m unittest discover -s tests -p "test_progressive_ui_pipeline.py" -v
      - name: Test acceptance manifest
        run: python -m unittest discover -s tests -p "test_acceptance_sample_manifest.py" -v
      - run: python dev_tools/audio_quality_audit.py
