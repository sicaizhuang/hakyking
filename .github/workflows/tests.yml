name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall hakyking dev_tools
      - name: Test model and project contracts
        run: python -m unittest tests.test_audio_edit_model tests.test_project_reliability -v
      - name: Test audio analysis and cache
        run: python -m unittest tests.test_adaptive_pitch_engine tests.test_analysis_cache_and_fast_path -v
      - name: Test DSP and render parity
        run: python -m unittest tests.test_dynamic_pitch_map tests.test_mixdown_parity tests.test_render_result_cache -v
      - name: Test pitch tools
        run: python -m unittest tests.test_pitch_tool_contracts -v
      - name: Test progressive UI pipeline
        run: python -m unittest tests.test_progressive_ui_pipeline -v
      - name: Test acceptance manifest
        run: python -m unittest tests.test_acceptance_sample_manifest -v
      - run: python dev_tools/audio_quality_audit.py
