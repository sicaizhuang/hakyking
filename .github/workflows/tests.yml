name: tests

on:
  push:
  pull_request:

jobs:
  python-tests:
    runs-on: ubuntu-latest
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python -m pip install --upgrade pip
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg libportaudio2 rubberband-cli
      - run: python -m pip install -r requirements.txt -r requirements-dev.txt
      - run: python -m compileall hakyking dev_tools
      - run: python -m unittest discover -s tests -v
      - run: python dev_tools/audio_quality_audit.py
